name: PR Labeler

on:
  pull_request_target:
    types:
      - opened
      - synchronize

# Read-only by default; the label job grants itself the extra
# pull-requests: write it needs to apply labels.
permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
